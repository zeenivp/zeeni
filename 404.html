<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — zeeni</title>
  <meta name="robots" content="noindex" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0f;
      --surface: #111118;
      --border:  #1e1e2e;
      --text:    #e2e2f0;
      --muted:   #6b6b8a;
      --accent:  #818cf8;
      --accent2: #34d399;
      --accent3: #f472b6;
      --mono:    'JetBrains Mono', monospace;
      --sans:    'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      text-align: center;
      padding: 24px;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Blobs ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.1;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--accent);  top: -150px; left: -150px; }
    .blob-2 { width: 400px; height: 400px; background: var(--accent3); bottom: -100px; right: -100px; }

    /* ── Grid lines (subtle) ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(129,140,248,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(129,140,248,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Content ── */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Big 404 */
    .code {
      font-family: var(--mono);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      position: relative;
    }

    /* Scanline effect on 404 */
    .code::after {
      content: '404';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 0%,
        transparent 49%,
        rgba(129, 140, 248, 0.04) 49%,
        rgba(129, 140, 248, 0.04) 51%,
        transparent 51%
      );
      background-size: 100% 6px;
      -webkit-background-clip: text;
      background-clip: unset;
      -webkit-text-fill-color: unset;
      pointer-events: none;
    }

    .label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--accent2);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.2);
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 28px;
    }

    .title {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .desc {
      font-size: 0.9rem;
      color: var(--muted);
      max-width: 380px;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .desc code {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(129, 140, 248, 0.08);
      border: 1px solid rgba(129, 140, 248, 0.15);
      padding: 1px 7px;
      border-radius: 4px;
    }

    /* Terminal block */
    .terminal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      width: 100%;
      max-width: 420px;
      text-align: left;
      margin-bottom: 36px;
    }
    .terminal-bar {
      display: flex;
      gap: 7px;
      margin-bottom: 16px;
    }
    .dot {
      width: 11px; height: 11px;
      border-radius: 50%;
    }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #28c840; }
    .terminal-line {
      font-family: var(--mono);
      font-size: 0.78rem;
      line-height: 1.9;
      color: var(--muted);
    }
    .terminal-line .prompt { color: var(--accent2); }
    .terminal-line .cmd    { color: var(--text); }
    .terminal-line .err    { color: var(--accent3); }
    .terminal-line .ok     { color: var(--accent2); }
    .cursor {
      display: inline-block;
      width: 7px; height: 13px;
      background: var(--accent);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: var(--sans);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #6366f1; transform: translateY(-1px); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    /* Footer note */
    .footer-note {
      position: fixed;
      bottom: 20px;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--border);
    }
  </style>
</head>
<body>

  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>

  <div class="container">

    <div class="code" aria-label="404">404</div>

    <span class="label">page not found</span>

    <h1 class="title">You've hit the edge — literally.</h1>

    <p class="desc">
      This URL doesn't resolve to anything. Maybe it was moved,
      deleted, or the <code>route</code> just doesn't exist yet.
    </p>

    <!-- Mini terminal -->
    <div class="terminal" role="region" aria-label="Terminal output">
      <div class="terminal-bar" aria-hidden="true">
        <span class="dot dot-r"></span>
        <span class="dot dot-y"></span>
        <span class="dot dot-g"></span>
      </div>
      <div class="terminal-line">
        <span class="prompt">zeeni@edge</span>:~$
        <span class="cmd"> GET /this-page</span>
      </div>
      <div class="terminal-line err">
        ✗ 404 Not Found — no matching route
      </div>
      <div class="terminal-line ok">
        → try navigating home instead
      </div>
      <div class="terminal-line">
        <span class="prompt">zeeni@edge</span>:~$ <span class="cursor" aria-hidden="true"></span>
      </div>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back home
      </a>
      <button class="btn btn-ghost" onclick="history.back()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Go back
      </button>
    </div>

  </div>

  <p class="footer-note" aria-hidden="true">// zeeni.vp — 2026</p>

</body>
</html>
